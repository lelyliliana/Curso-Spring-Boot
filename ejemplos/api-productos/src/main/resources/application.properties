spring.application.name=api-productos
server.address=127.0.0.1
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
app.nombre=API de productos
app.proveedor-url=${PROVEEDOR_URL:http://127.0.0.1:9090}
app.connect-timeout=500ms
app.read-timeout=500ms
app.intentos=1
app.editor-password=${APP_EDITOR_PASSWORD}
app.lector-password=${APP_LECTOR_PASSWORD}
app.tareas-habilitadas=false
logging.pattern.level=%5p [requestId=%X{requestId}]
